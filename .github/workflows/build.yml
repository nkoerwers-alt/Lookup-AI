
name: Build Fenn AI APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Fenn AI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify Manifest
        run: |
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('app/src/main/AndroidManifest.xml'); print('Manifest valid!')"

      - name: Verify Gradle Version
        run: gradle --version

      - name: Build APK
        run: gradle assembleDebug

      - name: Print Android Signing SHA-1
        run: |
          echo "========== FENN AI SIGNING REPORT =========="
          gradle :app:signingReport
          echo "============================================"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Fenn-AI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
