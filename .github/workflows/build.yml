
name: Build Fenn AI APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Fenn AI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Show Manifest Contents
        run: |
          echo "===== CURRENT BRANCH ====="
          git branch --show-current

          echo "===== MANIFEST FILE ====="
          ls -l app/src/main/AndroidManifest.xml

          echo "===== MANIFEST WITH LINE NUMBERS ====="
          nl -ba app/src/main/AndroidManifest.xml

          echo "===== ALL MANIFEST FILES ====="
          find . -name AndroidManifest.xml -print

      - name: Validate Manifest
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          path = "app/src/main/AndroidManifest.xml"

          with open(path, "rb") as file:
              content = file.read()

          print("First 200 bytes:", repr(content[:200]))

          try:
              ET.fromstring(content)
              print("SUCCESS: Manifest XML is valid!")
          except ET.ParseError as error:
              print("MANIFEST ERROR:", error)
              raise
          PY

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Fenn-AI-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
