
name: Build Fenn AI APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check Android Manifest
        run: |
          echo "Checking AndroidManifest.xml..."
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          path = "app/src/main/AndroidManifest.xml"

          try:
              ET.parse(path)
              print("SUCCESS: AndroidManifest.xml is valid!")
          except ET.ParseError as error:
              print("FAILED: AndroidManifest.xml contains invalid XML.")
              print(error)
              raise
          PY

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace --info

      - name: Upload Fenn AI APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Fenn-AI-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
